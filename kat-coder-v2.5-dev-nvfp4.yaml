model: sakamakismile/KAT-Coder-V2.5-Dev-NVFP4
runtime: vllm
container: eugr/spark-vllm:nightly-20260808
min_nodes: 1

metadata:
  description: KAT-Coder V2.5 Dev 35B A3B agentic coding model (NVFP4)
  model_params: 35B
  model_dtype: nvfp4
  kv_dtype: fp8

defaults:
  served_model_name: KAT-Coder-V2.5-Dev
  port: 9000
  host: 0.0.0.0
  tensor_parallel: 1
  max_model_len: 262144
  max_num_seqs: 64
  max_num_batched_tokens: 32768
  gpu_memory_utilization: 0.80

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --served-model-name {served_model_name} \
    --tensor-parallel-size {tensor_parallel} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --reasoning-parser qwen3 \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --kv-cache-dtype fp8 \
    --attention-backend flashinfer \
    --moe-backend flashinfer_b12x \
    --enable-chunked-prefill \
    --async-scheduling \
    --enable-prefix-caching \
    --load-format fastsafetensors \
    --language-model-only \
    --default-chat-template-kwargs '{"preserve_thinking": true}' \
    --override-generation-config '{"temperature":0.7,"top_p":0.8,"top_k":20,"presence_penalty":1.5}'
