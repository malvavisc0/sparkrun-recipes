model: lactroiii/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4
runtime: vllm
container: eugr/spark-vllm:nightly-20260807
min_nodes: 1
max_nodes: 1

metadata:
  description: NVIDIA Nemotron 3 Nano Omni 30B A3B (NVFP4) - multimodal video/audio/image/text reasoning
  model_params: 30B
  model_dtype: nvfp4
  kv_dtype: fp8

defaults:
  served_model_name: Nemotron-3-Nano-Omni-30b-a3b
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.70
  max_model_len: 262144
  max_num_seqs: 384
  video_pruning_rate: 0.60
  media_io_kwargs: '{"video": {"fps": 2, "num_frames": 256}}'
  reasoning_parser: nemotron_v3
  tool_call_parser: qwen3_coder
  kv_cache_dtype: fp8
  allowed_local_media_path: /

pre_exec:
  - |
    python3 -m pip install --quiet "vllm[audio]"

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --served-model-name {served_model_name} \
    --max-model-len {max_model_len} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-num-seqs {max_num_seqs} \
    --video-pruning-rate {video_pruning_rate} \
    --media-io-kwargs '{media_io_kwargs}' \
    --allowed-local-media-path {allowed_local_media_path} \
    --reasoning-parser {reasoning_parser} \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --kv-cache-dtype {kv_cache_dtype} \
    --trust-remote-code