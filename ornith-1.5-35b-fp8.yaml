# Ornith-1.5-35B-A3B FP8 (qwen3_5_moe) — text-only agentic-coding MoE with MTP.
#
# This profile uses:
#   - FP8 E4M3 weights (compressed-tensors; mtp.* kept bf16). Ornith 1.5 drops
#     the Qwen3VL vision stack of its Qwen3.5 parent; the checkpoint still
#     ships leftover visual.* tensors, skipped via --language-model-only.
#   - FP8 e4m3 KV cache. The checkpoint ships no FP8 KV scales and current vLLM has
#     no runtime calibration (--calculate-kv-scales was removed), so scales
#     default to 1.0. For calibrated scales, bake them into a checkpoint
#     offline with llm-compressor.
#   - MTP speculative decoding (mtp_num_hidden_layers=1, 2 draft tokens)
#
# IMPORTANT:
# - Pin the model revision and container digest before treating this as a
#   reproducible production recipe. Repository names and image tags are mutable.

model: ornith-ai/Ornith-1.5-35B-A3B-FP8
runtime: vllm
container: eugr/spark-vllm:nightly-20260826
min_nodes: 1

metadata:
  description: Ornith-1.5 35B-A3B FP8 (qwen3_5_moe, text-only + MTP) via vLLM
  model_params: 36B
  model_dtype: fp8
  kv_dtype: fp8_e4m3

defaults:
  served_model_name: Ornith-1.5-35B-A3B
  port: 9000
  host: 0.0.0.0
  tensor_parallel: 1
  max_model_len: 262144
  max_num_seqs: 4
  max_num_batched_tokens: 32768
  gpu_memory_utilization: 0.85
  load_format: fastsafetensors
  num_speculative_tokens: 2

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --served-model-name {served_model_name} \
    --tensor-parallel-size {tensor_parallel} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --trust-remote-code \
    --language-model-only \
    --kv-cache-dtype fp8_e4m3 \
    --attention-backend auto \
    --moe-backend auto \
    --enable-chunked-prefill \
    --async-scheduling \
    --enable-prefix-caching \
    --load-format {load_format} \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice \
    --speculative-config '{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}}' \
    --default-chat-template-kwargs '{"enable_thinking": true, "preserve_thinking": true}' \
    --override-generation-config '{"temperature":0.6,"top_p":0.95,"top_k":20}'
