# Qwen3.8-27B NVFP4 deployment for a single NVIDIA DGX Spark — DFlash 2 variant.
#
# Replicates the measured profile from
# pangoleen/qwen3.8-27b-dgx-spark-dflash2 (Paolo Rosson, @redp314; RESULTS.md
# 2026-09-01/02): SGLang + NVFP4 target + NVFP4 DFlash2 drafter, draft budget
# 16, MAX_RUNNING=4, bf16 KV cache, thinking off, and a kept FlashInfer
# autotune draw replayed from the persistent runtime cache.
#
# Measured on GB10 (128 GB unified, sm_121, aarch64, ~231 GB/s effective):
#   - source profile (pangoleen): ~64-78 tok/s single-stream decode from 320
#     tokens to 65k context (median ~70; two boots differ by a median 4.3%,
#     worst 8.1%); ~7-8 accepted tokens per verify pass of the 16-token
#     budget; prefill ~2,500 tok/s peak at 8k, 928 tok/s at 260k; no-drafter
#     baseline is 12.6-12.7 tok/s short-context — the drafter buys 5.5-5.9x
#   - this recipe (2026-09-03, updated target snapshot, dev-cu13 image,
#     draws replayed under FlashInfer 0.6.17): 93.9 tok/s net decode on the
#     512-token T=0 coding probe (scripts/bench_tps.py), accept length 9.3,
#     TTFT 0.18s warm — above the source band; T=0 code is the drafter's
#     best case, so expect mid-60s..70s on open-ended generation
#
# How this maps onto sparkrun:
#   - Image: lmsysorg/sglang:dev-cu13-qwen38-27b-dflash2 (pinned by digest
#     below) is the published build of the exact engine lineage the source
#     repo validated (day-0 qwen38-27b base + upstream PRs #35371 and #35496;
#     the source built the same tree locally as
#     qwen38-27b-sglang-dflash2-sm121:0.3.0). PR #35496 folds the DFlash2
#     selector into the draft CUDA graph on the packed FP4 lm_head — without
#     it the selector runs eager and throughput drops ("kept eager
#     (reason=quantized lm_head)" in the boot log is the tell). The image
#     ships FlashInfer 0.6.17; the draws were captured on 0.6.18 — the mod
#     installs them under the image's actual version dir (the draw *key* is
#     not version-hashed), verified 2026-09-03: 93.9 tok/s, accept 9.3.
#   - Revisions: both checkpoints are pinned via distribution_config below.
#     The target moved to the current RadixArk snapshot (updated upstream
#     2026-08-22, after the source measurements); the drafter SHA is the one
#     the source repo measured on. To move either forward, update the SHA in
#     all three places (top-level, defaults, distribution_config) — sparkrun
#     always re-runs snapshot_download for the pinned revision and re-syncs
#     hosts, so no cache clearing is needed.
#   - Tactic draws: the qwen38-dflash2-tactics mod (adjacent to this recipe)
#     installs the two kept FlashInfer autotune draws into the persistent
#     runtime cache (SGLANG_CACHE_DIR=/cache/runtime/sglang) before serve,
#     and maintains the offline-cache preconditions serve needs (refs/main
#     for the pinned SHAs, serve-user ownership of the caches).
#     FlashInfer autotuning is left ON so the draws are replayed; a fresh
#     draw is worth ~-16% decode until you clear, boot, measure, and keep a
#     good one (see the source repo's tactic-cache write-up).
#   - KV cache: bf16, not fp8_e4m3. fp8 KV measured +20-29% decode past
#     130k but -12-21% prefill and flipped one always-stable greedy prompt;
#     measured and deliberately not adopted by the source profile.
#
# Differences vs the sibling qwen3.8-27b-nvfp4.yaml (DSpark variant):
#   - drafter: maurienne-ai DFlash2 NVFP4 RTNcal (modelopt_fp4) vs RadixArk
#     DSpark (bf16/unquant)
#   - draft budget 16 (8->16 is +69.3% edit-heavy, +10.5% fresh; 24 is past
#     the knee) vs DSpark block 7
#   - max_running_requests 4 (KV pool 413,460 tokens — room for the full
#     262,144 context plus headroom) vs 10 on the DSpark side
#   - mem_fraction_static 0.65 pairs with MAX_RUNNING=4 on 128 GB unified
#   - thinking OFF by default (every published number is thinking-off);
#     the DSpark sibling defaults it on
#   - torch.compile / num_continuous_decode_steps: not used by the measured
#     DFlash2 profile (they are DSpark-tuned knobs)
#
# Every default below can be overridden at launch: -o draft_tokens=8,
# sparkrun run qwen3.8-27b-nvfp4-dflash -o spec=0 (lossless baseline), etc.

model: RadixArk/Qwen3.8-27B-NVFP4
model_revision: 319f741cce68d7914884900c138a1fbb70a42f30
runtime: sglang

# Published build of the validated engine lineage: day-0 qwen38-27b image +
# upstream PRs #35371 ("DFlash2: local convolution + candidate selector") and
# #35496 ("Support quantized target lm_head in the DFlash2 selector"). The
# branch dflash2-pin-1cf2b8c in sgl-project/sglang carries the same tree
# (1cf2b8c = PR #35496's merge). dev-cu13-qwen38-27b-dflash2 and
# dev-qwen38-27b-dflash2 are the same image (identical manifest digest); cu13
# is the CUDA line pangoleen measured (torch 2.13.0+cu130, FlashInfer 0.6.18).
# Pinned by digest for reproducibility. Multi-arch; arm64 runs on GB10.
container: lmsysorg/sglang:dev-cu13-qwen38-27b-dflash2

min_nodes: 1
max_nodes: 1

# The docker executor's defaults already match the source serve.sh's container
# flags: --ipc=host --shm-size 32gb --network host, rootless. The one
# serve.sh flag not expressible here is --cpuset-cpus 5-9,15-19 (big-core
# pinning, inherited by the source from a community recipe and unmeasured
# there). If you want it, pass it at launch:
#   sparkrun run qwen3.8-27b-nvfp4-dflash --executor-args '--cpuset-cpus=5-9,15-19'

# Both checkpoints pinned to the SHAs every published number was measured on.
# Revisions here must be literal strings — this block's entry *names* are
# template-rendered, but entry *revisions* are not. The draft entry is what
# pre-syncs the drafter to the host HF cache pinned (the runtime's prepare()
# hook would otherwise sync it unpinned); keep it identical to
# draft_model_revision in defaults.
distribution_config:
  models:
    entries:
      - name: RadixArk/Qwen3.8-27B-NVFP4
        revision: 319f741cce68d7914884900c138a1fbb70a42f30
      - name: maurienne-ai/Qwen3.8-27B-DFlash2-NVFP4-RTNcal
        revision: bd7a934213c47a9e7ef69eef36bb3325f47fd1f1

mods:
  - qwen38-dflash2-tactics   # installs the kept FlashInfer autotune draws

metadata:
  description: Qwen3.8 27B NVFP4 + DFlash 2 (block-diffusion) drafter, draft budget 16, NVFP4 drafter — measured-optimal Qwen3.8 profile on DGX Spark via SGLang
  model_params: 27B
  model_dtype: nvfp4
  kv_dtype: bfloat16
  target_hardware: NVIDIA DGX Spark (GB10, sm_121, aarch64)

  # Operational assumptions from the measured profile. Revalidate whenever the
  # model, drafter, container, or workload changes.
  tested_concurrency: 4
  tested_mem_fraction_static: 0.65

defaults:
  # Target-model commit SHA (mirror of top-level model_revision, so it is
  # available as {model_revision} in the command template). Updated upstream 2026-08-22; this pin tracks
  # the current snapshot (moves off the SHA pangoleen measured — revalidate).
  model_revision: 319f741cce68d7914884900c138a1fbb70a42f30

  # Drafter commit SHA (see distribution_config above for the pre-sync pin).
  draft_model_revision: bd7a934213c47a9e7ef69eef36bb3325f47fd1f1

  # Name exposed through the OpenAI-compatible API. The source profile serves
  # lowercase 'qwen3.8-27b'; keep the sibling recipes' casing for consistency.
  served_model_name: qwen3.8-27b

  host: 0.0.0.0
  port: 9000

  # One GPU / unified-memory device on DGX Spark.
  tensor_parallel: 1

  # Native model context. Prompt + output share the same 262,144-token
  # allowance (practical ceiling ~261,888).
  max_model_len: 262144

  # 4 gives a 413,460-token KV pool: room for one full-context request plus
  # headroom. 16 concurrent seats shrinks the pool to 238,605 tokens — below
  # the context window, and long inputs are refused with HTTP 400. Don't
  # raise this without re-checking the pool size in the boot log
  # (max_total_num_tokens).
  max_running_requests: 4

  # Pairs with MAX_RUNNING=4 on 128 GB unified: the drafter adds ~1.5 GB on
  # top of the ~14 GB target weights, and CUDA-graph capture needs its share.
  mem_fraction_static: 0.65

  attention_backend: flashinfer

  # 2048 keeps decode inter-token latency smooth under mixed load on hybrid
  # GDN models (8192-token chunks stall decode ~600 ms at a time) — same
  # choice as the DSpark sibling.
  chunked_prefill_size: 2048

  # bf16 KV. fp8_e4m3 is +20-29% decode past 130k context and -12-21% prefill
  # (RESULTS.md §7); not adopted because it flipped one always-stable greedy
  # prompt. Re-test at the task level before adopting.
  kv_cache_dtype: bfloat16

  # BF16 recurrent state halves the per-slot footprint vs fp32.
  mamba_ssm_dtype: bfloat16

  # extra_buffer strategy for the GDN state pool (source serve.sh). Keep any
  # manual max-mamba-cache-size pin synchronized with this strategy's slot
  # count if you add one; the source profile sizes the pool by ratio instead.
  mamba_radix_cache_strategy: extra_buffer
  page_size: 1
  mamba_full_memory_ratio: 11.93

  # ---- DFlash 2 speculative decoding ----
  speculative_algorithm: DFLASH

  # NVFP4 drafter (RTN-calibrated): 1.45 GB of weights read per verify pass
  # instead of 3.85 GB (bf16), acceptance unchanged, +5-10% generation. A
  # quantised drafter can load cleanly and silently stop speculating (the GPTQ
  # build logged healthy and produced exactly 1.0 accepted tokens/pass) —
  # watch `saturation` on /metrics, not tok/s; ~6% means no speculation.
  speculative_draft_model_path: maurienne-ai/Qwen3.8-27B-DFlash2-NVFP4-RTNcal

  # Names the drafter's quantisation scheme — required for this checkpoint
  # (same scheme the NVFP4 target runs).
  speculative_draft_model_quantization: modelopt_fp4

  # Draft budget 16, not the 8 the DFlash2 blog uses. The drafter's
  # block_size of 8 is not a cap on the verify budget: 8 -> 16 is +69.3%
  # edit-heavy and +10.5% fresh. 24 is past the knee; both workloads fall.
  # (--speculative-num-draft-tokens sets the verify window; block_size
  # coerces into it one-way at runtime.)
  speculative_num_draft_tokens: 16

  speculative_draft_attention_backend: flashinfer

  # Parsers must match the output formats produced by this model/template.
  reasoning_parser: qwen3
  tool_call_parser: qwen3_coder

command: |
  : "${SGLANG_API_KEY:?SGLANG_API_KEY must be set}"
  # The SGLang pair (this recipe + the DSpark sibling) gate the API key inline
  # here and read $SGLANG_API_KEY from the ambient container env, intentionally
  # diverging from the vLLM recipes' cluster-env convention. Do not "fix" one
  # half of the A/B pair without the other.

  python3 -m sglang.launch_server \
    --model-path {model} \
    --revision {model_revision} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tp {tensor_parallel} \
    --context-length {max_model_len} \
    --trust-remote-code \
    --mem-fraction-static {mem_fraction_static} \
    --attention-backend {attention_backend} \
    --chunked-prefill-size {chunked_prefill_size} \
    --kv-cache-dtype {kv_cache_dtype} \
    --mamba-ssm-dtype {mamba_ssm_dtype} \
    --mamba-radix-cache-strategy {mamba_radix_cache_strategy} \
    --page-size {page_size} \
    --mamba-full-memory-ratio {mamba_full_memory_ratio} \
    --max-running-requests {max_running_requests} \
    --speculative-algorithm {speculative_algorithm} \
    --speculative-draft-model-path {speculative_draft_model_path} \
    --speculative-draft-model-revision {draft_model_revision} \
    --speculative-draft-model-quantization {speculative_draft_model_quantization} \
    --speculative-num-draft-tokens {speculative_num_draft_tokens} \
    --speculative-draft-attention-backend {speculative_draft_attention_backend} \
    --reasoning-parser {reasoning_parser} \
    --tool-call-parser {tool_call_parser} \
    --default-chat-template-kwargs '{"enable_thinking": false, "preserve_thinking": false}' \
    --enable-metrics \
    --api-key "$SGLANG_API_KEY"
