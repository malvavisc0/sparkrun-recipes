model: unsloth/Qwen3.8-27B-NVFP4
runtime: vllm
container: eugr/spark-vllm:nightly-20260815
min_nodes: 1

metadata:
  description: Qwen3.8 27B NVFP4 (Unsloth Dynamic V3.0, FP8 attention + MTP) via vLLM
  model_params: 27B
  model_dtype: nvfp4
  kv_dtype: fp8

defaults:
  served_model_name: Qwen3.8-27B
  port: 9000
  host: 0.0.0.0
  tensor_parallel: 1
  max_model_len: 262144
  max_num_seqs: 4
  max_num_batched_tokens: 16384
  gpu_memory_utilization: 0.85
  load_format: instanttensor

env:
  CUTE_DSL_ARCH: sm_121a
  FLASHINFER_CUDA_ARCH_LIST: 12.1a
  TORCH_CUDA_ARCH_LIST: 12.1a
  VLLM_USE_FLASHINFER_SAMPLER: '1'
  VLLM_MARLIN_USE_ATOMIC_ADD: '1'

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --distributed-executor-backend mp \
    --tensor-parallel-size {tensor_parallel} \
    --load-format {load_format} \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --trust-remote-code \
    --tool-call-parser qwen3_coder \
    --reasoning-parser qwen3 \
    --max-num-seqs {max_num_seqs} \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
    --default-chat-template-kwargs '{"enable_thinking": true, "preserve_thinking": true}' \
    --override-generation-config '{"temperature":0.65,"top_p":0.95,"top_k":20,"min_p":0.0,"repetition_penalty":1.05,"presence_penalty":0.5}'
