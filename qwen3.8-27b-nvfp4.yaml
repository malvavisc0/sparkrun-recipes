model: RadixArk/Qwen3.8-27B-NVFP4
runtime: sglang
container: lmsysorg/sglang:qwen38-27b
min_nodes: 1

metadata:
  description: Qwen3.8 27B NVFP4 (W4A4 + FP8 projections, ~16.5GB weights) via SGLang
  model_params: 27B
  model_dtype: nvfp4
  kv_dtype: fp8_e4m3

defaults:
  served_model_name: Qwen3.8-27B
  port: 9000
  host: 0.0.0.0
  tensor_parallel: 1
  # Native context; we do not extend beyond this (no YaRN).
  max_model_len: 262144
  max_running_requests: 10
  # Cookbook DGX Spark cell uses 0.95, but that was unstable in practice on
  # unified memory (OS starvation); 0.85 is the tested stable value.
  mem_fraction_static: 0.85
  attention_backend: flashinfer
  # DGX Spark is the cookbook's documented exception to the 2048-token
  # chunked-prefill guidance for hybrid GDN models.
  chunked_prefill_size: 8192
  # Explicit fp8 KV. The NVFP4 checkpoint declares kv_cache_quant_algo: FP8,
  # so `auto` would resolve to the same dtype with the checkpoint's scales.
  kv_cache_dtype: fp8_e4m3
  # bf16 state slots (78.4MB) instead of the fp32 default (153.9MB/slot).
  mamba_ssm_dtype: bfloat16
  # ratio = (S+D) x state_bytes / (L x kv_bytes_per_token)
  #       = 8 x 78.4MB / (L x 32.8KB) -> 4.21 for L ~= 4.5K avg tokens.
  # --max-mamba-cache-size below pins the pool and overrides this ratio.
  mamba_full_memory_ratio: 4.21
  # extra_buffer_lazy: S=4 state slots per request at no accuracy cost.
  mamba_radix_cache_strategy: extra_buffer_lazy
  # S + D = 4 (extra_buffer_lazy) + 4 (EAGLE draft tokens) = 8 slots/request.
  mamba_slots_per_req: 8
  speculative_algorithm: EAGLE
  speculative_num_steps: 3
  speculative_eagle_topk: 1
  speculative_num_draft_tokens: 4
  reasoning_parser: qwen3
  tool_call_parser: qwen3_coder

command: |
  python3 -m sglang.launch_server \
    --model-path {model} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tp {tensor_parallel} \
    --context-length {max_model_len} \
    --trust-remote-code \
    --mem-fraction-static {mem_fraction_static} \
    --attention-backend {attention_backend} \
    --chunked-prefill-size {chunked_prefill_size} \
    --disable-prefill-cuda-graph \
    --kv-cache-dtype {kv_cache_dtype} \
    --mamba-ssm-dtype {mamba_ssm_dtype} \
    --mamba-full-memory-ratio {mamba_full_memory_ratio} \
    --mamba-radix-cache-strategy {mamba_radix_cache_strategy} \
    --max-mamba-cache-size $(({max_running_requests} * {mamba_slots_per_req})) \
    --max-running-requests {max_running_requests} \
    --speculative-algorithm {speculative_algorithm} \
    --speculative-num-steps {speculative_num_steps} \
    --speculative-eagle-topk {speculative_eagle_topk} \
    --speculative-num-draft-tokens {speculative_num_draft_tokens} \
    --reasoning-parser {reasoning_parser} \
    --tool-call-parser {tool_call_parser} \
    --sampling-defaults model \
    --default-chat-template-kwargs '{"enable_thinking": true, "preserve_thinking": true}' \
    --preferred-sampling-params '{"temperature":0.65,"top_p":0.95,"top_k":20,"min_p":0.0,"repetition_penalty":1.05,"presence_penalty":0.5}' \
    --enable-metrics \
    --api-key "$SGLANG_API_KEY"
